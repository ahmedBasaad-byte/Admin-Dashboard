<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <!-- SIDEBAR -->
        <div class="dashboard">
            <div class="title">
                <div class="Mlogo">
                    <div class="box box1"></div>
                    <div class="box box2"></div>
                    <div class="box box3"></div>
                    <div class="box box4"></div>
                </div>
                <h2>Dashboard</h2>
            </div>

            <div class="nav-menu">
                <div class="mainM">
                    <button class="nav-btn"><span>🏠️</span> Home</button>
                    <button class="nav-btn"><span>🪪</span> Profile</button>
                    <button class="nav-btn"><span>✉️</span> Message</button>
                    <button class="nav-btn"><span>🕙️</span> History</button>
                    <button class="nav-btn"><span>📝</span> Tasks</button>
                    <button class="nav-btn"><span>🫂</span> Communities</button>
                </div>
                <div class="sideM">
                    <button class="nav-btn"><span>⚙️</span> Settings</button>
                    <button class="nav-btn"><span>❔</span> Support</button>
                    <button class="nav-btn"><span>🛡️</span> Privacy</button>
                </div>
            </div>
        </div>

        <!-- MAIN PAGE -->
        <div class="mainPage">
            <!-- Top Header (Search, Bell, Profile) -->
            <div class="top-header">
                <input type="text" placeholder="Search...">
                <div class="user-info">
                    <span>🔔</span>
                    <span>🐱 Morgan Oakley</span>
                </div>
            </div>

            <!-- Welcome Banner -->
            <div class="welcome-banner">
                <div>
                    <p>Hi there,</p>
                    <h3>Morgan Oakley (@morgan)</h3>
                </div>
                <div class="banner-buttons">
                    <button>New</button>
                    <button>Upload</button>
                    <button>Share</button>
                </div>
            </div>

            <!-- Projects & Announcements Area -->
            <div class="content-area">
                <div class="projects-section">
                    <h3>Your Projects</h3>
                    <div class="project-grid">
                        <!-- Project Card 1 -->
                        <div class="project-card">
                            <h4>Super Cool Project</h4>
                            <p>Sed tempus ut lacus ut scelerisque...</p>
                        </div>
                        <!-- Project Card 2 -->
                        <div class="project-card">
                            <h4>Less Cool Project</h4>
                            <p>Nullam condimentum ipsum ut lectus...</p>
                        </div>
                        <!-- Add more cards as needed -->
                    </div>
                </div>
                
                <div class="announcements-section">
                    <h3>Announcements</h3>
                    <div class="announcement-card">
                        <p><strong>Site Maintenance</strong><br>Vestibulum condimentum...</p>
                    </div>
                </div>
            </div>
        </div>

    </div> <!-- Closed the container div! -->
</body>
</html>
